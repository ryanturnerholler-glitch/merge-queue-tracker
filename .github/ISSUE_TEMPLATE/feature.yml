name: Feature request
description: Suggest something the extension should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your proposed change, if you have one.
